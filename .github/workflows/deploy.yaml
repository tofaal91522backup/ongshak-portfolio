name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Manual escape hatch: Actions tab -> Deploy to VPS -> Run workflow.
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the one in flight.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Push deploys only when the commit asks for it. Manual runs always deploy.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'ong:deploy')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Next inlines NEXT_PUBLIC_* vars into the bundle at build time, so .env is
      # needed here and nowhere else — it is not shipped to the VPS. Anything in it
      # ends up publicly readable in the JS; ENV_FILE should hold only public config
      # like NEXT_PUBLIC_WEB3FORMS_KEY, never a secret.
      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Install dependencies
        run: npm ci

      # `output: "export"` in next.config.ts writes the static site to out/.
      - name: Build
        run: npm run build

      # The build is plain static files. strip_components drops the leading
      # `out/`, so index.html lands directly in VPS_TARGET_PATH. Old hashed
      # assets are left behind (harmless) rather than wiping the live directory.
      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: out
          strip_components: 1
          target: ${{ secrets.VPS_TARGET_PATH }}

      # No restart step: nginx serves VPS_TARGET_PATH directly and picks up the
      # new files immediately. Every page is its own HTML file, so nginx uses
      # `try_files $uri $uri/ $uri.html =404;` — not the SPA /index.html fallback.
